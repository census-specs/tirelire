name: Construire l'APK Android

# Lancement : onglet Actions > « Construire l'APK Android » > Run workflow
# ou automatiquement quand vous poussez une étiquette de version (ex. v2.8).
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer Capacitor
        run: npm install --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Copier l'application dans www/
        run: |
          mkdir -p www
          cp ../index.html ../sw.js ../manifest.webmanifest ../icon.svg ../icon-180.png ../icon-192.png ../icon-512.png www/

      - name: Créer le projet Android
        run: npx cap add android

      - name: Mettre l'icône de Tirelire
        run: ./scripts/android-icons.sh

      - name: Synchroniser
        run: npx cap sync android

      - name: Compiler l'APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Tirelire.apk

      - name: Publier l'APK (téléchargeable dans l'onglet Actions)
        uses: actions/upload-artifact@v4
        with:
          name: Tirelire-apk
          path: android-app/Tirelire.apk

      - name: Joindre l'APK à la release (si étiquette de version)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android-app/Tirelire.apk
